<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Todo List</title>
    <link rel=" stylesheet" href="home.css">
    <link rel="stylesheet" href="todo.css">
    <link rel="stylesheet" href="todayInfo.css">
    <link rel="stylesheet" href="smiski.css">
    <link rel="stylesheet" href="calendar.css">
    <script src="https://kit.fontawesome.com/b135c336b7.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Sans+Mono:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="todoContainer">
      <h1>Tasks</h1>
      <div id="listContainer"></div>
      <div id="inputContainer">
        <input type="text" id="textBox">
        <button id ="addBtn">+</button>
      </div>
    </div>
    <div id="todayInfoContainer">
      <div id="dateTimeContainer">
        <div id="time"></div>
        <div id= "date"></div>
      </div>
      <div id="weatherContainer"></div>
    </div>
    <div id="smiskiContainer"></div>
    <div id ="calendarContainer">
      <h1>Events</h1>
      <div id ="eventList"></div>
    </div>
    
    <script type="module" src="config.js"></script>
    <script type="module" src="supabaseClient.js"></script>
    <script type="module" src="todo.js"></script>
    <script type="module" src="todayInfo.js"></script>
    <script src="smiski.js"></script>
    <script src="calendar.js"></script>
  </body>
</html>
